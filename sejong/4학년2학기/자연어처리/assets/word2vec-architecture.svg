<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-label="Word2Vec: two prediction directions"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#475569"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="30" y="40" font-size="24" fill="#0f172a" text-anchor="start">Word2Vec: two prediction directions</text><text x="30" y="70" font-size="15" fill="#475569" text-anchor="start">Lecture W02 pp.19–26 | same vocabulary, different input/output roles</text><text x="35" y="190" font-size="21" fill="#0f172a" text-anchor="start">CBOW</text><text x="35" y="390" font-size="21" fill="#0f172a" text-anchor="start">Skip-gram</text><rect x="160" y="110" width="205" height="110" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="262.5" y="159.0" font-size="17" fill="#0f172a" text-anchor="middle">Context words</text><text x="262.5" y="183.0" font-size="17" fill="#0f172a" text-anchor="middle">lookup vectors</text><polyline points="365,165 405,165" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="405" y="120" width="170" height="90" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="490.0" y="159.0" font-size="17" fill="#0f172a" text-anchor="middle">Sum / average</text><text x="490.0" y="183.0" font-size="17" fill="#0f172a" text-anchor="middle">H dimensions</text><polyline points="575,165 625,165" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="625" y="120" width="180" height="90" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="715.0" y="159.0" font-size="17" fill="#0f172a" text-anchor="middle">Output scores</text><text x="715.0" y="183.0" font-size="17" fill="#0f172a" text-anchor="middle">V dimensions</text><polyline points="805,165 850,165" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="850" y="120" width="200" height="90" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="950.0" y="159.0" font-size="17" fill="#0f172a" text-anchor="middle">Softmax</text><text x="950.0" y="183.0" font-size="17" fill="#0f172a" text-anchor="middle">Predict center</text><rect x="160" y="310" width="205" height="110" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="262.5" y="359.0" font-size="17" fill="#0f172a" text-anchor="middle">Center word</text><text x="262.5" y="383.0" font-size="17" fill="#0f172a" text-anchor="middle">W row lookup</text><polyline points="365,365 405,365" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="405" y="320" width="170" height="90" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="490.0" y="359.0" font-size="17" fill="#0f172a" text-anchor="middle">Input vector</text><text x="490.0" y="383.0" font-size="17" fill="#0f172a" text-anchor="middle">H dimensions</text><polyline points="575,365 625,365" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="625" y="320" width="180" height="90" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="715.0" y="359.0" font-size="17" fill="#0f172a" text-anchor="middle">Output W-prime</text><text x="715.0" y="383.0" font-size="17" fill="#0f172a" text-anchor="middle">H x V</text><polyline points="805,365 850,365" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="850" y="320" width="200" height="90" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="950.0" y="359.0" font-size="17" fill="#0f172a" text-anchor="middle">Softmax</text><text x="950.0" y="383.0" font-size="17" fill="#0f172a" text-anchor="middle">Predict context</text><text x="160" y="485" font-size="18" fill="#0f172a" text-anchor="start">Shared principle: similar context prediction encourages similar vectors.</text><text x="160" y="520" font-size="17" fill="#0f172a" text-anchor="start">Input W: V x H. Output W-prime: H x V. Usually reuse W as embeddings.</text></g></svg>