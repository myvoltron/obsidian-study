<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="Sentence CNN: variable length to fixed features"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#475569"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="30" y="40" font-size="24" fill="#0f172a" text-anchor="start">Sentence CNN: variable length to fixed features</text><text x="30" y="70" font-size="15" fill="#475569" text-anchor="start">Lecture W04b pp.16–24 | one filter produces one pooled scalar</text><rect x="35" y="210" width="190" height="170" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="130.0" y="277.0" font-size="17" fill="#0f172a" text-anchor="middle">Sentence X</text><text x="130.0" y="301.0" font-size="17" fill="#0f172a" text-anchor="middle">n tokens x k</text><text x="130.0" y="325.0" font-size="17" fill="#0f172a" text-anchor="middle">embedding width</text><text x="45" y="455" font-size="17" fill="#0f172a" text-anchor="start">Filter width = k</text><rect x="300" y="120" width="160" height="85" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="380.0" y="156.5" font-size="17" fill="#0f172a" text-anchor="middle">h = 3</text><text x="380.0" y="180.5" font-size="17" fill="#0f172a" text-anchor="middle">multiple filters</text><polyline points="225,295 265,295 265,162 300,162" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="500" y="120" width="170" height="85" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="585.0" y="156.5" font-size="17" fill="#0f172a" text-anchor="middle">Feature maps</text><text x="585.0" y="180.5" font-size="17" fill="#0f172a" text-anchor="middle">length n-3+1</text><polyline points="460,162 500,162" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="710" y="120" width="150" height="85" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="785.0" y="156.5" font-size="17" fill="#0f172a" text-anchor="middle">Max over time</text><text x="785.0" y="180.5" font-size="17" fill="#0f172a" text-anchor="middle">one per filter</text><polyline points="670,162 710,162" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="860,162 900,162 900,295 925,295" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="300" y="265" width="160" height="85" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="380.0" y="301.5" font-size="17" fill="#0f172a" text-anchor="middle">h = 4</text><text x="380.0" y="325.5" font-size="17" fill="#0f172a" text-anchor="middle">multiple filters</text><polyline points="225,295 265,295 265,307 300,307" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="500" y="265" width="170" height="85" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="585.0" y="301.5" font-size="17" fill="#0f172a" text-anchor="middle">Feature maps</text><text x="585.0" y="325.5" font-size="17" fill="#0f172a" text-anchor="middle">length n-4+1</text><polyline points="460,307 500,307" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="710" y="265" width="150" height="85" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="785.0" y="301.5" font-size="17" fill="#0f172a" text-anchor="middle">Max over time</text><text x="785.0" y="325.5" font-size="17" fill="#0f172a" text-anchor="middle">one per filter</text><polyline points="670,307 710,307" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="860,307 900,307 900,295 925,295" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="300" y="410" width="160" height="85" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="380.0" y="446.5" font-size="17" fill="#0f172a" text-anchor="middle">h = 5</text><text x="380.0" y="470.5" font-size="17" fill="#0f172a" text-anchor="middle">multiple filters</text><polyline points="225,295 265,295 265,452 300,452" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="500" y="410" width="170" height="85" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="585.0" y="446.5" font-size="17" fill="#0f172a" text-anchor="middle">Feature maps</text><text x="585.0" y="470.5" font-size="17" fill="#0f172a" text-anchor="middle">length n-5+1</text><polyline points="460,452 500,452" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="710" y="410" width="150" height="85" rx="10" fill="#fef3c7" stroke="#94a3b8"/><text x="785.0" y="446.5" font-size="17" fill="#0f172a" text-anchor="middle">Max over time</text><text x="785.0" y="470.5" font-size="17" fill="#0f172a" text-anchor="middle">one per filter</text><polyline points="670,452 710,452" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="860,452 900,452 900,295 925,295" fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="925" y="225" width="140" height="140" rx="10" fill="#fce7f3" stroke="#94a3b8"/><text x="995.0" y="277.0" font-size="17" fill="#0f172a" text-anchor="middle">Concat: m</text><text x="995.0" y="301.0" font-size="17" fill="#0f172a" text-anchor="middle">Dropout + FC</text><text x="995.0" y="325.0" font-size="17" fill="#0f172a" text-anchor="middle">Class softmax</text><text x="40" y="565" font-size="18" fill="#0f172a" text-anchor="start">h in {3,4,5}, 100 filters each -&gt; m = 300, regardless of sentence length.</text></g></svg>